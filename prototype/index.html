<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d173c">
  <meta name="description" content="Uvaha — a local AI assistant with cited sources">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Uvaha</title>
</head>
<body>
  <aside id="session-drawer" class="session-drawer" aria-label="Chat sessions" hidden>
    <div class="drawer-heading">
      <h2>Chats</h2>
      <button id="sessions-close" class="quiet-button" type="button" aria-label="Close chats">Close</button>
    </div>
    <button id="new-session" class="new-session" type="button">New chat</button>
    <nav class="session-navigation" aria-label="Saved chats">
      <h3>Recent</h3>
      <ul id="session-list" class="session-list"></ul>
      <details id="archived-sessions" class="archived-sessions">
        <summary>Archived <span id="archived-count" class="session-count">0</span></summary>
        <ul id="archived-session-list" class="session-list"></ul>
      </details>
    </nav>
    <p id="storage-status" class="storage-status" role="status">Saved only in this browser.</p>
  </aside>
  <button id="session-scrim" class="drawer-scrim" type="button" aria-label="Close chats" hidden></button>
  <header class="masthead">
    <div class="masthead-left">
      <button id="sessions-toggle" class="quiet-button" type="button" aria-controls="session-drawer" aria-expanded="false">Chats</button>
      <a class="brand" href="/" aria-label="Uvaha home">Uvaha</a>
    </div>
    <div class="status" id="status" aria-live="polite">Starting…</div>
  </header>
  <main>
    <section class="conversation" aria-label="Conversation">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="ask-form" class="composer">
        <label for="question">Ask anything</label>
        <div class="composer-row">
          <textarea id="question" name="question" rows="2" maxlength="4000" placeholder="Start a conversation" required></textarea>
          <button type="submit">Ask</button>
        </div>
        <div class="composer-options">
          <label class="source-choice" for="source-mode">Sources</label>
          <select id="source-mode" name="source_mode" aria-label="Sources">
            <option value="automatic" disabled>Automatic</option>
            <option value="local_only" selected>Local library only</option>
          </select>
        </div>
      </form>
    </section>
    <section class="utility" aria-label="Application information">
      <details>
        <summary>About</summary>
        <p id="about-copy">Uvaha answers with sources you can inspect.</p>
      </details>
      <details>
        <summary>Diagnostics</summary>
        <dl id="versions"></dl>
        <p id="corpus-summary"></p>
      </details>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
